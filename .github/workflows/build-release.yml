name: Build and release

# Every push to main and every pull request builds the bridge DLL and the MCP server and keeps
# the packaged zip as a workflow artifact. Pushing a tag v* (for example v0.3.0) also publishes a
# GitHub Release with that zip.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # creating the release

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      # ---- bridge DLL (MSVC x64; MinHook and nlohmann_json come from FetchContent)
      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build stellaris_bridge.dll
        run: cmake --build build --config Release --target stellaris_bridge --parallel

      # ---- MCP server
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stellaris_mcp_server/package-lock.json
      - name: Build MCP server
        working-directory: stellaris_mcp_server
        run: |
          npm ci
          npm run build

      # ---- package: DLL + injector + MCP server with its production dependencies
      - name: Package
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { "dev-$($env:GITHUB_SHA.Substring(0, 7))" }
          $name = "stellaris-mcp-$ver"
          $out = Join-Path "package" $name
          New-Item -ItemType Directory -Force -Path "$out/mcp-server", "$out/scripts" | Out-Null

          Copy-Item build/stellaris_bridge/Release/stellaris_bridge.dll $out/
          Copy-Item scripts/inject.py, scripts/launch_stellaris.py "$out/scripts/"
          Copy-Item -Recurse stellaris_mcp_server/dist "$out/mcp-server/dist"
          Copy-Item stellaris_mcp_server/package.json, stellaris_mcp_server/package-lock.json "$out/mcp-server/"
          Push-Location "$out/mcp-server"
          npm ci --omit=dev --ignore-scripts
          Pop-Location

          # the DLL only works with the stellaris.exe build its SDK was generated from
          $ts = (Select-String -Path stellaris_bridge/include/sdk/stellaris_sdk.hpp -Pattern "kExeTimestamp = (0x[0-9A-Fa-f]+)").Matches[0].Groups[1].Value
          $built = [DateTimeOffset]::FromUnixTimeSeconds([Convert]::ToInt64($ts, 16)).UtcDateTime.ToString("yyyy-MM-dd HH:mm 'UTC'")

          @"
          # Stellaris MCP $ver

          Built for the stellaris.exe whose PE timestamp is $ts ($built), Stellaris 4.5.1
          (Windows x64). With any other build the bridge refuses to dispatch commands; regenerate
          the SDK with tools/sdk_dumper/dump.py and rebuild from source.

          1. Start the game: ``python scripts/launch_stellaris.py`` (runs stellaris.exe -dx11; edit the
             game directory in the script if yours differs). Load a save.
          2. Inject the bridge: ``python scripts/inject.py stellaris_bridge.dll``
          3. Register the MCP server (stdio) with your client: ``node mcp-server/dist/index.js``
             (Node.js 20+). It talks to the bridge over \\.\pipe\stellaris_mcp_bridge.
          "@ | Set-Content -Encoding utf8 "$out/README.md"

          $zip = "package/$name.zip"
          Compress-Archive -Path $out -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $name.zip" | Set-Content -Encoding ascii "$zip.sha256"

          "name=$name" >> $env:GITHUB_OUTPUT
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "exe_timestamp=$ts" >> $env:GITHUB_OUTPUT
          "exe_built=$built" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256

      # ---- release (tags only)
      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.zip }}.sha256
          generate_release_notes: true
          body: |
            Built for **Stellaris 4.5.1** (Windows x64), `stellaris.exe` PE timestamp `${{ steps.package.outputs.exe_timestamp }}` (${{ steps.package.outputs.exe_built }}).
            The bridge only works with that exact game build; see README.md in the zip for setup.
